services:
  api:
    build: ./docker/api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://psiron:psiron@postgres:5432/psiron
      REDIS_URL: redis://redis:6379/0
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: psiron
      POSTGRES_PASSWORD: psiron
      POSTGRES_DB: psiron
    volumes: [psiron-db:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: psiron
      MINIO_ROOT_PASSWORD: change-me
    ports: ["9000:9000","9001:9001"]
    volumes: [psiron-object:/data]
volumes:
  psiron-db:
  psiron-object:
